# Siteyi derleyip GitHub Pages'e yukler.
# main branch'e her push'ta ve elle (workflow_dispatch) calisir.
#
# Site kendi alan adinda (https://maxetadecor.com) kok dizinden yayinlanir:
# basePath yoktur, derlemeye fazladan ortam degiskeni verilmez. Alan adi
# public/CNAME dosyasindan ve deponun Pages ayarindan gelir.

name: GitHub Pages'e yukle

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages'e yukleme icin gereken izinler
permissions:
  contents: read
  pages: write
  id-token: write

# Ayni anda tek dagitim; devam eden dagitim iptal edilmez
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Derle
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci

      - name: Statik siteyi derle
        run: npm run build

      - name: .nojekyll ekle
        # GitHub Pages'in Jekyll islemesini kapatir; _next klasoru yoksa sayilmaz.
        run: touch out/.nojekyll

      - name: Ciktiyi yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Yayina al
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e dagit
        id: deployment
        uses: actions/deploy-pages@v4
